name: Windows-vs-WSL perf bench (self-hosted)

# Runs the REAL Windows-vs-WSL comparison (bench.ps1 / setup.ps1) on a
# self-hosted Windows runner that has WSL2 + a Linux distro installed.
# GitHub-hosted runners cannot do this (see ci-bench.yml for the
# hosted-runner, single-machine-per-OS alternative) - there is no WSL guest
# available on windows-latest/windows-11-arm images.
#
# Requirements on the self-hosted runner (see README "Design notes" /
# setup.ps1 header for full detail):
#   - Registered to this repo with the label used below (default:
#     wsl-bench) - currently: marcpe-d3-perfbench (ARM64), a second runner
#     instance on the same machine as the llvm-project GB300 runner,
#     registered separately to this repo since self-hosted runners are
#     tied to a single repo on a personal GitHub account.
#   - WSL2 installed with a distro and passwordless sudo configured for
#     the runner service account (WslDistro auto-detects if not passed
#     explicitly - see Get-DefaultWslDistro in lib/BenchCommon.psm1)
#   - Windows-side build prerequisites (VS Build Tools/clang-cl, CMake,
#     Ninja) already installed - clang-cl is put on PATH via
#     ilammy/msvc-dev-cmd@v1 below (arch auto-detected from runner.arch)
#
# Deliberately workflow_dispatch-only: self-hosted runners must never be
# triggered from pull_request/schedule on this public repo (arbitrary PR
# code would execute on real, persistent hardware).

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Bench mode'
        type: choice
        options: [Tight, Full]
        default: Tight
      runner_label:
        description: 'Self-hosted runner label to target'
        type: string
        default: wsl-bench
      wsl_distro:
        description: 'WSL distro name (see `wsl -l -v` on the runner). Leave empty to auto-detect.'
        type: string
        default: ''
      commit:
        description: 'LLVM commit/branch to build for the bench trees'
        type: string
        default: main
      force_setup:
        description: 'Force setup.ps1 to rebuild trees even if present'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  wsl-bench:
    # Label is chosen at dispatch time (defaults to 'wsl-bench' above);
    # runs-on supports expressions so the actual label used by the
    # self-hosted runner registration can be overridden per-dispatch.
    runs-on: [self-hosted, Windows, '${{ inputs.runner_label }}']
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Report runner identity
        shell: pwsh
        run: |
          Write-Host "Running on: $env:COMPUTERNAME"
          wsl -l -v

      - name: Set up MSVC dev environment (clang-cl)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ runner.arch == 'ARM64' && 'arm64' || 'amd64' }}

      - name: Add standalone LLVM/clang-cl to PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $llvmBin = 'C:\Program Files\LLVM\bin'
          if (Test-Path (Join-Path $llvmBin 'clang-cl.exe')) {
            Add-Content -Path $env:GITHUB_PATH -Value $llvmBin
            Write-Host "Added $llvmBin to PATH"
          } else {
            Write-Host "::warning::clang-cl.exe not found at $llvmBin - setup.ps1 will fail its prerequisite check. Install LLVM (e.g. 'winget install LLVM.LLVM') on this runner."
          }

      - name: Ensure build trees exist (setup.ps1)
        shell: pwsh
        run: |
          $forceFlag = @()
          if ('${{ inputs.force_setup }}' -eq 'true') { $forceFlag = @('-Force') }
          $distroArgs = @()
          if ('${{ inputs.wsl_distro }}') { $distroArgs = @('-WslDistro', '${{ inputs.wsl_distro }}') }
          .\setup.ps1 -Commit '${{ inputs.commit }}' @distroArgs @forceFlag

      - name: Run Windows-vs-WSL bench
        shell: pwsh
        run: |
          $distroArgs = @()
          if ('${{ inputs.wsl_distro }}') { $distroArgs = @('-WslDistro', '${{ inputs.wsl_distro }}') }
          $runDir = "results/wsl-runs/$env:GITHUB_RUN_ID"
          New-Item -ItemType Directory -Force -Path $runDir | Out-Null
          .\bench.ps1 -Mode '${{ inputs.mode }}' @distroArgs -OutputDir $runDir

          # bench.ps1's own output is gitignored under results/*.md by
          # design (personal/local runs); publish this CI run's report
          # under results/wsl-runs/<run-id>/ (explicitly un-ignored) and
          # also copy the latest one to a stable, discoverable filename.
          $latestMd = Get-ChildItem $runDir -Filter '*.md' | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if ($latestMd) {
            Copy-Item $latestMd.FullName 'results/WSL-BENCH-RESULTS.md' -Force
            "Published latest WSL bench results: results/WSL-BENCH-RESULTS.md (from $($latestMd.Name))"
          } else {
            Write-Host "::warning::bench.ps1 produced no .md report in $runDir"
          }

      - name: Upload bench results artifact
        uses: actions/upload-artifact@v4
        with:
          name: wsl-bench-results
          path: |
            results/wsl-runs/${{ github.run_id }}/*.md
            results/wsl-runs/${{ github.run_id }}/*.csv
          if-no-files-found: warn

      - name: Commit results back to repo
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "results/wsl-runs/$env:GITHUB_RUN_ID" results/WSL-BENCH-RESULTS.md
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "No new result files to commit."
          } else {
            git commit -m "wsl-bench: results for run $env:GITHUB_RUN_ID ($env:GITHUB_SHA)"
            # This job can run for a long time (full LLVM builds); master may
            # have moved since checkout, and the checkout is shallow, so
            # unshallow before rebasing onto the current remote tip.
            git fetch --unshallow origin master 2>&1 | Out-Null
            git rebase origin/master
            git push origin HEAD:master
          }
